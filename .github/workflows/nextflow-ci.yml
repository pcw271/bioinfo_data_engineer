name: Nextflow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-nextflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Miniconda and create environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.10.*
          environment-file: environment.yml
          activate-environment: bioinfo_data
          auto-update-conda: true
          auto-activate-base: false
          channels: conda-forge,defaults


      - name: Debug conda creation
        run: |
          echo ">>> Checking conda version"
          conda --version
          echo ">>> Listing environment files"
          ls -lah
          echo ">>> Showing environment.yml"
          cat environment.yml


      - name: Cache Nextflow
        uses: actions/cache@v4
        with:
          path: ~/.nextflow
          key: nextflow-${{ runner.os }}-${{ hashFiles('**/main.nf') }}

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Run pipeline
        run: |
          nextflow run main.nf -with-report report.html -with-trace trace.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results/

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-report
          path: |
            report.html
            trace.txt

      - name: Debug Conda setup
        run: |
          conda info
          conda list
          cat environment.yml

